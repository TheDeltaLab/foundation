name: NPM Publish Packages

permissions:
  contents: read
  id-token: write

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. base-v0.2.0)'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag_name }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Resolve package from tag
        id: resolve
        env:
          TAG_NAME: ${{ github.event.inputs.tag_name }}
        run: |
          set -e

          case "$TAG_NAME" in
            base-v*)
              PKG_PATH="packages/base"
              PKG_FILTER="@delta-ai/base"
              ;;
            platform-v*)
              PKG_PATH="packages/platform"
              PKG_FILTER="@delta-ai/platform"
              ;;
            eslint-config-v*)
              PKG_PATH="packages/eslint-config"
              PKG_FILTER="@delta-ai/eslint-config"
              ;;
            *)
              echo "::error::Unknown tag prefix in: $TAG_NAME"
              exit 1
              ;;
          esac

          TAG_VERSION="${TAG_NAME#*-v}"
          PKG_VERSION=$(node -p "require('./${PKG_PATH}/package.json').version")

          echo "path=${PKG_PATH}" >> $GITHUB_OUTPUT
          echo "filter=${PKG_FILTER}" >> $GITHUB_OUTPUT

          echo "Tag: $TAG_NAME → ${PKG_FILTER} @ ${PKG_PATH} (tag=${TAG_VERSION}, pkg=${PKG_VERSION})"

          if [[ "$TAG_VERSION" != "$PKG_VERSION" ]]; then
            echo "::error::Tag version ($TAG_VERSION) does not match $PKG_PATH/package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm turbo run build --filter='${{ steps.resolve.outputs.filter }}...'

      - name: Publish
        working-directory: ${{ steps.resolve.outputs.path }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -e
          ARGS="--access public"
          VERSION=$(node -p "require('./package.json').version")
          if [[ $VERSION == *-* ]]; then
            ARGS="$ARGS --tag preview"
          fi
          npm publish $ARGS
